
name: Build Rabbit Farm Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RabbitFarmManagerAndroid.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -o RabbitFarmManagerAndroid.zip -d .

      - name: Build APK
        run: gradle assembleDebug
        working-directory: RabbitFarmManagerAndroid

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RabbitFarmManager-APK
          path: RabbitFarmManagerAndroid/app/build/outputs/apk/debug/app-debug.apk
